map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # This server sits behind a proxy that terminates TLS on another port, so
    # a redirect built from what nginx itself is listening on names a scheme
    # and a port that reach nobody. Relative redirects keep whatever the
    # client was already using.
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_read_timeout 600s;
    }

    # The endpoint is published as a resource identifier with no trailing
    # slash, so the address a client is handed has to answer without a
    # redirect: a redirected POST is how a body goes missing.
    location = /mcp {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /mcp/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The authorization flow: the screen the owner approves on, the token
    # endpoint a connector calls, and the two documents a client reads to find
    # them. Matched by prefix with ^~ so that nothing else claims them, and
    # narrowed to the oauth documents so that a certificate challenge under
    # /.well-known/ still reaches whatever answers it.
    location /oauth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    location ^~ /.well-known/oauth- {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    location /health/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
