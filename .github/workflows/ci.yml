name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_DB: ragmanager
          POSTGRES_USER: ragmanager
          POSTGRES_PASSWORD: ragmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragmanager -d ragmanager"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ci-only-and-not-a-secret
      DJANGO_ALLOWED_HOSTS: testserver,localhost
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ragmanager
      CACHE_URL: redis://localhost:6379/1
      REDIS_URL: redis://localhost:6379/0
      S3_ACCESS_KEY_ID: ci
      S3_SECRET_ACCESS_KEY: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt
      - name: Check the project and its migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run the test suite
        run: python manage.py test apps

  frontend:
    name: Panel types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx vue-tsc --noEmit
      - name: Locale keys match
        run: |
          node -e '
            const en = require("./src/i18n/locales/en.json");
            const es = require("./src/i18n/locales/es.json");
            const flat = (o, p = "") => Object.entries(o).flatMap(([k, v]) =>
              typeof v === "object" ? flat(v, p + k + ".") : [p + k]);
            const a = new Set(flat(en)), b = new Set(flat(es));
            const missing = [...a].filter(k => !b.has(k)).concat([...b].filter(k => !a.has(k)));
            if (missing.length) { console.error("Unpaired keys:", missing); process.exit(1); }
            console.log(a.size + " keys in both locales");
          '
      - name: Build
        run: npx vite build
